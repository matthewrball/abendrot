# Abendrot — Continuous Integration
#
# This workflow has two execution paths:
#
# Default CI (no Apple account):
# lint -> complete WarmthKit + CLI headless tests -> app build -> plain DMG.
# Works on forked PRs and on a repo with ZERO secrets configured.
#
# Manual release validation:
# adds: import Developer ID cert into a temp keychain -> archive/export
# (Developer ID) -> notarize -> staple -> verify. It runs only from
# workflow_dispatch on exact `main`, behind the `release-signing`
# environment, and fails if any required signing/notarization secret is
# absent.
#
# A separate, self-hosted `display-matrix` job reserves the shape of future
# physical-hardware testing. It is manual-dispatch only, never runs on push/PR,
# never sees fork secrets, and intentionally cannot pass until real hardware
# runners and tests exist. The hosted `test-warmthcore` check runs the complete
# headless WarmthKit and CLI suites on every push/PR.
#
# Repository signing/ASC secrets are read only inside `sign-notarize`, which
# can run only for manual dispatch on exact
# `refs/heads/main` after the `release-signing` environment gate. Push and PR
# jobs never reference signing secrets.

name: CI

on:
  push:
    # `main` only fast-forwards a green `public-dev` SHA. Source work continues on
    # `dev`; scrubbed publication snapshots run the same gates on `public-dev`.
    branches: [dev, public-dev]
  pull_request:
  workflow_dispatch:
    inputs:
      run_display_matrix:
        description: "Run the self-hosted physical display matrix (requires a registered self-hosted runner)."
        type: boolean
        default: false

# Least-privilege default. The release workflow (not this one) requests
# `contents: write` to create releases.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ABENDROT_APP_SCHEME: Abendrot
  WARMTHKIT_PACKAGE_PATH: WarmthKit
  # Keep the runner on the supported macOS/Xcode generation instead of floating
  # on `macos-latest`.
  MACOS_RUNNER: macos-26
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint (always; hosted; no secrets). Advisory toolchain swift-format only.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: macos-26
    # Advisory, NON-BLOCKING: runs the formatters and surfaces findings, but never gates CI.
    # There is no committed style config yet, so a style nit must not turn the whole board red.
    # The real required gates are test-warmthcore + build-app-unsigned. Make this strict + remove
    # continue-on-error once a .swift-format config is agreed and the tree is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: swift-format --lint
        run: |
          # swift-format is the Swift 6 toolchain subcommand: `swift format`
          # (not a standalone binary).
          swift format --version || true
          # Lint the SPM package + app sources. `--recursive` walks the tree.
          # Config: .swift-format at repo root when present; otherwise use the
          # toolchain defaults.
          if [ -f .swift-format ]; then
            CFG="--configuration .swift-format"
          else
            CFG=""
            echo "::notice::No .swift-format config found; using toolchain defaults."
          fi
          # Lint each Swift source root that exists.
          set -e
          for dir in "${WARMTHKIT_PACKAGE_PATH}/Sources" "${WARMTHKIT_PACKAGE_PATH}/Tests" App Abendrot; do
            if [ -d "$dir" ]; then
              echo "swift format lint: $dir"
              swift format lint --recursive $CFG "$dir" || true   # advisory: report, never fail
            fi
          done

  # ---------------------------------------------------------------------------
  # 2. Complete headless unit tests — THE REAL REQUIRED GATE (always; hosted;
  # no secrets). This runs pure engine math/state tests, fake-backed DDC
  # transaction/recovery tests, shared control validation, and CLI tests.
  # NO real displays or private-framework calls — physical hardware work is
  # the manual-dispatch PLANNED job below, which is explicitly NOT a gate.
  #
  # This job runs on EVERY push/PR (including forks) and FAILS hard if the
  # package or tests are missing/failing. It does not skip-pass: a green CI
  # here means every local headless suite actually ran and passed.
  # ---------------------------------------------------------------------------
  test-warmthcore:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          swift --version || true

      - name: Build + test WarmthKit (SPM, headless)
        working-directory: ${{ env.WARMTHKIT_PACKAGE_PATH }}
        run: |
          set -euo pipefail
          if [ ! -f Package.swift ]; then
            echo "::error::${WARMTHKIT_PACKAGE_PATH}/Package.swift is missing — the"
            echo "::error::required headless test gate cannot run. Failing."
            exit 1
          fi
          # Fake-backed DDC tests load no private framework and touch no display,
          # so the complete package remains deterministic and hosted-safe.
          swift test --parallel

      - name: Build + test CLI (SPM, headless)
        working-directory: cli
        run: |
          set -euo pipefail
          [ -f Package.swift ] || {
            echo "::error::cli/Package.swift is missing — required CLI tests cannot run."
            exit 1
          }
          swift test --parallel

  shell-release-guards:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Release guard tests
        run: scripts/release/test-release-guards.sh

  # ---------------------------------------------------------------------------
  # 3. App build (unsigned compile) — REQUIRED gate, always, no secrets.
  # The .xcodeproj is a git-ignored build artifact; project.yml is the source
  # of truth. This job GENERATES the project from project.yml with XcodeGen and
  # builds the app scheme UNSIGNED. generate OR build failure FAILS the job —
  # "no project file" can no longer silently pass (the previous bug).
  # ---------------------------------------------------------------------------
  build-app-unsigned:
    runs-on: macos-26
    # lint is advisory (continue-on-error) and intentionally NOT a dependency here, so a style
    # finding can never block the real app-build gate.
    needs: [test-warmthcore]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install verified XcodeGen
        run: |
          set -euo pipefail
          curl -fsSL "$XCODEGEN_URL" -o "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -qx "Version: $XCODEGEN_VERSION"

      - name: Generate Abendrot.xcodeproj from project.yml
        run: |
          set -euo pipefail
          if [ ! -f project.yml ]; then
            echo "::error::project.yml missing — cannot generate the Xcode project."
            exit 1
          fi
          # XcodeGen reads project.yml (scheme ${ABENDROT_APP_SCHEME}) and emits the
          # git-ignored .xcodeproj. A spec error MUST fail the job, not be skipped.
          xcodegen generate --spec project.yml

      - name: Build Abendrot.app (unsigned)
        run: |
          set -euo pipefail
          # The app target links the local WarmthKit package. We build the app
          # scheme unsigned (CODE_SIGNING_ALLOWED=NO) so no Apple account is
          # needed. If the real engine cannot link headlessly with the full
          # toolchain, that surfaces HERE as a build failure — which is the point:
          # a broken app build now fails CI instead of passing on a missing project.
          xcodebuild \
            -project "${ABENDROT_APP_SCHEME}.xcodeproj" \
            -scheme "$ABENDROT_APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ABENDROT_SOURCE_COMMIT="$GITHUB_SHA" \
            build

      - name: Build plain DMG
        run: |
          set -euo pipefail
          # The unsigned build above placed the app under the derived-data Release
          # products dir. Package it to smoke-test the DMG layout on every push
          # (NOT a release — releases come from scripts/release/). A missing app
          # here means the build step above did not produce it: fail loudly.
          APP_PATH="build/DerivedData/Build/Products/Release/${ABENDROT_APP_SCHEME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected built app at $APP_PATH but it is absent."
            exit 1
          fi
          SOURCE_COMMIT="$(/usr/bin/plutil -extract AbendrotSourceCommit raw \
            "$APP_PATH/Contents/Info.plist" 2>/dev/null || true)"
          [ "$SOURCE_COMMIT" = "$GITHUB_SHA" ] || {
            echo "::error::Built app is not bound to the checked-out source commit."
            exit 1
          }
          mkdir -p build
          ./scripts/dmg/plain-dmg.sh \
            --app "$APP_PATH" \
            --out "build/${ABENDROT_APP_SCHEME}-ci.dmg" \
            --volname "Abendrot"

  public-release-gate:
    name: public-dev/release-gate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/public-dev' }}
    runs-on: ubuntu-latest
    needs: [test-warmthcore, build-app-unsigned, shell-release-guards]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify public-dev gate provenance
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/public-dev" ]
          [ "$GITHUB_REF_NAME" = "public-dev" ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "${{ needs.test-warmthcore.result }}" = "success" ]
          [ "${{ needs.build-app-unsigned.result }}" = "success" ]
          [ "${{ needs.shell-release-guards.result }}" = "success" ]

      - name: Validate public appcast
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          appcast = Path("appcast.xml")
          expected_title = "Abendrot"
          expected_link = "https://raw.githubusercontent.com/matthewrball/abendrot/main/appcast.xml"
          insertion_anchor = "release.sh inserts new <item> elements directly below this line."

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          try:
              parser = ET.XMLParser(target=ET.TreeBuilder(insert_comments=True))
              root = ET.parse(appcast, parser=parser).getroot()
          except (OSError, ET.ParseError) as error:
              fail(f"Invalid appcast.xml: {error}")

          if root.tag != "rss" or root.get("version") != "2.0":
              fail("appcast.xml must have one RSS 2.0 root.")

          channels = [node for node in root if node.tag == "channel"]
          if len(channels) != 1:
              fail("appcast.xml must have exactly one direct channel.")
          channel = channels[0]

          titles = [node for node in channel if node.tag == "title"]
          if len(titles) != 1 or (titles[0].text or "").strip() != expected_title:
              fail(f"appcast.xml channel title must be {expected_title!r}.")

          links = [node for node in channel if node.tag == "link"]
          if len(links) != 1 or (links[0].text or "").strip() != expected_link:
              fail(f"appcast.xml channel link must be {expected_link}.")

          children = list(channel)
          anchors = [
              index
              for index, node in enumerate(children)
              if node.tag is ET.Comment
              and (node.text or "").strip() == insertion_anchor
          ]
          if len(anchors) != 1:
              fail("appcast.xml must contain exactly one direct release insertion anchor.")

          item_indexes = [
              index for index, node in enumerate(children) if node.tag == "item"
          ]
          if item_indexes and anchors[0] > min(item_indexes):
              fail("appcast.xml release insertion anchor must precede every item.")

          print("Public appcast XML and canonical channel metadata are valid.")
          PY

      - name: Verify curated public tree
        run: |
          set -euo pipefail
          expected=(
            "App/Sources"
            "App/Resources"
            "WarmthKit/Sources"
            "WarmthKit/Tests"
            "scripts/dmg"
            "scripts/release"
            "cli/Sources"
            "cli/Tests"
            "cli/completions"
            "WarmthKit/Package.swift"
            "WarmthKit/Package.resolved"
            "project.yml"
            ".github/workflows/ci.yml"
            "cli/Package.swift"
            "cli/Package.resolved"
            "AGENTS.md"
            "docs/abendrot.1"
            "appcast.xml"
            "PRIVACY.md"
            "README.md"
            ".gitignore"
            "LICENSE"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "assets/abendrot-icon.png"
          )

          missing=()
          for e in "${expected[@]}"; do
            git ls-files -- "$e" | grep -q . || missing+=("$e")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required tracked public entry:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          critical_files=(appcast.xml PRIVACY.md LICENSE SECURITY.md)
          for f in "${critical_files[@]}"; do
            [ -f "$f" ] || { echo "::error::Missing required public file: $f"; exit 1; }
            git ls-files --error-unmatch "$f" >/dev/null
          done

          strays=()
          while IFS= read -r f; do
            ok=""
            for e in "${expected[@]}"; do
              if [[ "$f" == "$e" || "$f" == "$e"/* ]]; then ok=1; break; fi
            done
            [ -z "$ok" ] && strays+=("$f")
          done < <(git ls-files)
          if [ "${#strays[@]}" -gt 0 ]; then
            echo "::error::Unexpected tracked public file(s):"
            printf '  %s\n' "${strays[@]}"
            exit 1
          fi

          section_mark="$(printf '\302\247')"
          tokens=(
            '/U''sers/'
            '/ho''me/[a-z]'
            'abendrot-''(build|public)'
            "$section_mark"
            '\bfound''er\b'
            '(^|[^$])\{\{[^}]+\}\}'
          )
          pat="$(IFS='|'; echo "${tokens[*]}")"
          set +e
          hits="$(git grep -nEI "$pat" -- .)"
          rc=$?
          set -e
          case "$rc" in
            0)
              printf '%s\n' "$hits"
              echo "::error::Public leak scan found tells above."
              exit 1
              ;;
            1) echo "Public tree allowlist + leak scan clean." ;;
            *) echo "::error::Public leak scan failed."; exit "$rc";;
          esac

  # ---------------------------------------------------------------------------
  # 4. Sign + notarize + staple (MODE A ONLY).
  # Manual validation path only: workflow_dispatch on exact main, behind the
  # release-signing environment. Missing signing/notarization inputs fail this
  # explicitly requested job before any credential import or artifact work.
  # ---------------------------------------------------------------------------
  sign-notarize:
    runs-on: macos-26
    needs: [build-app-unsigned]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    environment: release-signing   # GitHub "environment" -> optional required reviewers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate signing/notarization secret bundle
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP_IDENTITY }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            CERT_P12_BASE64 \
            CERT_PASSWORD \
            DEVELOPER_ID_APP \
            ASC_API_KEY_P8_BASE64 \
            ASC_API_KEY_ID \
            ASC_API_ISSUER_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for signed release validation."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Import Developer ID cert into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/abendrot-signing.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive + export (Developer ID)
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP_IDENTITY }}  # e.g. "Developer ID Application: Name (TEAMID)"
        run: |
          set -euo pipefail
          # The .xcodeproj is git-ignored; generate it from project.yml (same
          # source of truth as the Mode-B build job). A missing spec or generate
          # failure FAILS the signed build — it must not skip-pass.
          if [ ! -f project.yml ]; then
            echo "::error::project.yml missing — cannot generate the Xcode project for a signed release."
            exit 1
          fi
          curl -fsSL "$XCODEGEN_URL" -o "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          xcodegen --version | grep -qx "Version: $XCODEGEN_VERSION"
          xcodegen generate --spec project.yml
          ARCHIVE="$RUNNER_TEMP/Abendrot.xcarchive"
          xcodebuild \
            -project "${ABENDROT_APP_SCHEME}.xcodeproj" \
            -scheme "$ABENDROT_APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_APP" \
            ABENDROT_SOURCE_COMMIT="$GITHUB_SHA" \
            OTHER_CODE_SIGN_FLAGS="--options runtime --timestamp" \
            archive
          # ExportOptions.plist must live in scripts/release/ (committed; no secrets).
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist scripts/release/ExportOptions-DeveloperID.plist
          EXPORTED_APP="$RUNNER_TEMP/export/${ABENDROT_APP_SCHEME}.app"
          SPARKLE_KEY="$(/usr/bin/plutil -extract SUPublicEDKey raw \
            "$EXPORTED_APP/Contents/Info.plist" 2>/dev/null || true)"
          SPARKLE_FEED="$(/usr/bin/plutil -extract SUFeedURL raw \
            "$EXPORTED_APP/Contents/Info.plist" 2>/dev/null || true)"
          SOURCE_COMMIT="$(/usr/bin/plutil -extract AbendrotSourceCommit raw \
            "$EXPORTED_APP/Contents/Info.plist" 2>/dev/null || true)"
          [ "$SOURCE_COMMIT" = "$GITHUB_SHA" ] || {
            echo "::error::Signed artifact is not bound to the checked-out source commit."
            exit 1
          }
          SPARKLE_KEY_BYTES="$(
            printf '%s' "$SPARKLE_KEY" | /usr/bin/base64 -D 2>/dev/null | wc -c | tr -d ' '
          )"
          [ "$SPARKLE_KEY_BYTES" = "32" ] || {
            echo "::error::Signed artifact SUPublicEDKey must decode to exactly 32 bytes."
            exit 1
          }
          EXPECTED_FEED="https://raw.githubusercontent.com/matthewrball/abendrot/main/appcast.xml"
          [ "$SPARKLE_FEED" = "$EXPECTED_FEED" ] || {
            echo "::error::Signed artifact SUFeedURL must be $EXPECTED_FEED"
            exit 1
          }
          echo "EXPORTED_APP=$EXPORTED_APP" >> "$GITHUB_ENV"

      - name: Notarize + staple + verify
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${EXPORTED_APP:-}" ] || [ ! -d "${EXPORTED_APP:-/nonexistent}" ]; then
            echo "::error::Signing job produced no exported app."
            exit 1
          fi
          # Build a plain DMG to notarize (scripted, headless-safe fallback).
          ./scripts/dmg/plain-dmg.sh \
            --app "$EXPORTED_APP" \
            --out "$RUNNER_TEMP/Abendrot.dmg" \
            --volname "Abendrot"
          # notarize.sh reads ASC_* from env; no-ops with a clear message if unset.
          ./scripts/release/notarize.sh "$RUNNER_TEMP/Abendrot.dmg"

      - name: Tear down temporary keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "${SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  # ===========================================================================
  # SELF-HOSTED PHYSICAL DISPLAY MATRIX — PLANNED, NOT A GATE (UNIMPLEMENTED).
  #
  # This job documents and reserves the structure for future real-hardware tests:
  # - M5 (Tahoe, gamma-broken) - M3/M4 (gamma works)
  # - Apple display (Studio Display / built-in, buttonless)
  # - generic DDC monitor - HDMI-on-Apple-Silicon / dock edge case
  #
  # It runs ONLY on manual dispatch with an explicit opt-in input, and ONLY on
  # a runner labeled `self-hosted, macOS, abendrot-display-matrix`.
  # It NEVER runs on push/PR, so it never sees fork secrets and never blocks CI.
  #
  # ANTI-GREEN-THEATRE: this job is UNIMPLEMENTED and therefore intentionally
  # FAILS (exit 1) when dispatched. A passing run must NEVER be possible until
  # real integration is wired, so a green check cannot imply hardware validation
  # that did not happen. Replace the failing stub with real integration scripts
  # (DDC probe, gamma self-test/demotion, overlay coverage incl. fullscreen
  # Spaces, hotplug/sleep-wake re-baseline) before removing the `exit 1`.
  # ===========================================================================
  display-matrix-planned-not-a-gate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_display_matrix == 'true'
    runs-on: [self-hosted, macOS, abendrot-display-matrix]
    strategy:
      fail-fast: false
      matrix:
        rig:
          - { name: "m5-tahoe-gamma-broken", note: "gamma writes no-op; must route to overlay" }
          - { name: "m3-m4-gamma-works",     note: "gamma path should pass self-test" }
          - { name: "apple-display",          note: "buttonless panel; DDC may be absent -> overlay" }
          - { name: "generic-ddc-monitor",    note: "hardware warmth via IOAVService DDC" }
          - { name: "hdmi-dock-edgecase",     note: "HDMI on Apple Silicon / dock transport" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Describe planned matrix rig (UNIMPLEMENTED — fails on purpose)
        run: |
          echo "=== PLANNED self-hosted display-matrix rig: ${{ matrix.rig.name }} ==="
          echo "Intent: ${{ matrix.rig.note }}"
          echo "::warning::This job is PLANNED and UNIMPLEMENTED. It is NOT a passing"
          echo "::warning::gate. Wire real integration here once a physical"
          echo "::warning::self-hosted runner is registered. Planned checks:"
          cat <<'EOF'
            1. swift test integration suite against real displays (DisplayServices/HardwareDDC).
            2. DDC capability probe + write/verify; emergency Restore Displays exercised.
