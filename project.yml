# Abendrot — XcodeGen project spec (app UI).
#
# Generates `Abendrot.xcodeproj` (scheme `Abendrot`, matching .github/workflows/ci.yml
# env ABENDROT_APP_SCHEME) wiring the SwiftUI/AppKit menu-bar app to the local
# WarmthKit Swift package. Regenerate after editing this file or adding sources:
#
# xcodegen generate
#
# The generated .xcodeproj is a BUILD ARTIFACT — it is git-ignored. project.yml is the
# source of truth (App/README.md documents the workflow).
#
# Deploys to macOS 14 "Sonoma" and later; builds with the macOS 26 SDK for native
# Liquid Glass on Tahoe; Swift 6 strict concurrency; LSUIElement agent app (no Dock icon).
# Builds UNSIGNED/local — no Apple Developer account needed for development.

name: Abendrot

options:
  bundleIdPrefix: app.abendrot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Unsigned/local development builds — no Apple account required.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: app.abendrot.Abendrot
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "8"
    # Release builds override this with `git rev-parse HEAD`. release.sh refuses
    # to publish an artifact whose embedded source revision is missing or stale.
    ABENDROT_SOURCE_COMMIT: "development"
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

# Local WarmthKit package (the FROZEN engine contract surface the app links).
packages:
  WarmthKit:
    path: WarmthKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: b6496a74a087257ef5e6da1c5b29a447a60f5bd7 # Sparkle 2.9.4

targets:
  Abendrot:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
        excludes:
          - .omc/**
      - path: App/Resources
    dependencies:
      # Link only the umbrella product — the app talks to WarmthEngine, never backends.
      - package: WarmthKit
        product: WarmthKit
      # The shared control-surface schema (preference keys, notification name, message/snapshot
      # DTOs) the app uses to observe + apply CLI/AI control messages and write state.json.
      - package: WarmthKit
        product: AbendrotControl
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Resources/Info.plist
      properties:
        # LSUIElement = agent app: no Dock icon, no Cmd-Tab.
        LSUIElement: true
        CFBundleName: Abendrot
        CFBundleDisplayName: Abendrot
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AbendrotSourceCommit: "$(ABENDROT_SOURCE_COMMIT)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Abendrot. Warm into the evening."
        # No camera/mic/location/accessibility usage strings — core function needs no
        # permissions. A notification usage prompt is requested at
        # runtime during onboarding, not declared as an always-on permission.
        #
        # Sparkle auto-update wiring (the release runbook — single signing
        # authority). The appcast lives at the raw GitHub URL; Sparkle reads it to
        # discover updates.
        SUFeedURL: "https://raw.githubusercontent.com/matthewrball/abendrot/main/appcast.xml"
        # Let Sparkle schedule checks at most once every 24 hours and download in
        # the background by default. User opt-outs persist; manual checks remain.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        # EdDSA public key for the Sparkle signing key whose private half lives only
        # in the maintainer's login keychain.
        SUPublicEDKey: "HW5DAqjbnmoAtvM/DVUj9iFHNC9YSjFn2vNkZguu6iM="
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentBase
        # App (Finder / DMG / About-box) icon — the sunset-glass AppIcon in
        # Colors.xcassets, generated from assets/abendrot.png via
        # scripts/icon/build-icons.py. (The menu-bar glyph is separate, drawn
        # programmatically as MenuBarGlyph.)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
